name: One-time Meta Ads Vault setup

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  update-production-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vault CLI
        uses: eLco/setup-vault@v1
        with:
          vault_version: 1.15.0

      - name: Authenticate to Vault with GitHub OIDC
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_AUDIENCE: ${{ secrets.VAULT_AUDIENCE }}
          VAULT_AUTH_PATH: ${{ secrets.VAULT_AUTH_PATH }}
          VAULT_AUTH_ROLE: ${{ secrets.VAULT_AUTH_ROLE }}
        run: |
          set -euo pipefail
          id_token="$(curl -fsSL -X GET "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${VAULT_AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')"
          vault_token="$(vault write -field=token "${VAULT_AUTH_PATH}" role="${VAULT_AUTH_ROLE}" jwt="${id_token}")"
          echo "::add-mask::${vault_token}"
          echo "VAULT_TOKEN=${vault_token}" >> "${GITHUB_ENV}"

      - name: Write and verify Meta Ads production configuration
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${META_ACCESS_TOKEN}"

          path="k8s/ucode-prod/go-admin-api-gateway"
          bootstrap_json="$(vault kv get -mount=secret -format=json "${path}")"
          role_id="$(jq -er '.data.data.VAULT_ROLE_ID | select(type == "string" and length > 0)' <<<"${bootstrap_json}")"
          secret_id="$(jq -er '.data.data.VAULT_SECRET_ID | select(type == "string" and length > 0)' <<<"${bootstrap_json}")"
          mount_path="$(jq -r '.data.data.VAULT_MOUNT_PATH // "approle"' <<<"${bootstrap_json}")"
          unset bootstrap_json

          echo "::add-mask::${role_id}"
          echo "::add-mask::${secret_id}"
          app_token="$(vault write -field=token "auth/${mount_path}/login" role_id="${role_id}" secret_id="${secret_id}")"
          echo "::add-mask::${app_token}"

          VAULT_TOKEN="${app_token}" vault kv patch -method=patch -mount=secret "${path}" \
            META_ACCESS_TOKEN="${META_ACCESS_TOKEN}" \
            META_AD_ACCOUNT_ID="843587364827107" \
            META_GRAPH_BASE_URL="https://graph.facebook.com" \
            META_GRAPH_VERSION="v26.0" \
            META_ADS_CACHE_TTL_SEC="1800" \
            META_ADS_REQUEST_TIMEOUT_SEC="30" \
            META_ADS_MAX_RANGE_DAYS="90" \
            META_LEAD_ACTION_TYPES="lead" \
            META_ATTRIBUTION_WINDOWS=""

          account_id="$(VAULT_TOKEN="${app_token}" vault kv get -mount=secret -field=META_AD_ACCOUNT_ID "${path}")"
          stored_token="$(VAULT_TOKEN="${app_token}" vault kv get -mount=secret -field=META_ACCESS_TOKEN "${path}")"
          test "${account_id}" = "843587364827107"
          test "${#stored_token}" -gt 100
          echo "Meta Ads production keys are present in Vault."
