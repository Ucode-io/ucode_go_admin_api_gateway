name: Rotate UCODE Instagram secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ${{ secrets.GH_TOKEN }}
      ENCRYPTED_VALUE: "HPf87EKDA258I6tZW40tQjT9FjZBAiD/VtbCZwesXx0cTzJB9qpj09/WwYBEDv+eDB4vL1jBOaOkqSUJXoVYm7b/fGLiyjSODvsSxmBB2Co="
    steps:
      - name: Store rotated UCODE Instagram client secret
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN}"
          key_id="$(
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Ucode-io/ucode_go_admin_api_gateway/actions/secrets/public-key \
              | jq -r '.key_id'
          )"
          test -n "${key_id}"
          payload="$(jq -cn \
            --arg encrypted_value "${ENCRYPTED_VALUE}" \
            --arg key_id "${key_id}" \
            '{encrypted_value: $encrypted_value, key_id: $key_id}')"
          curl --fail --silent --show-error \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Ucode-io/ucode_go_admin_api_gateway/actions/secrets/UCODE_INSTAGRAM_CLIENT_SECRET \
            -d "${payload}"
